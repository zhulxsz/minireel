name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test test --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tool/release.test.cjs
      - name: Read app version
        id: version
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build Windows
        run: flutter build windows --release --build-name "${{ steps.version.outputs.version }}" --build-number "${{ github.run_number }}"
      - name: Ensure Inno Setup is available
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build Windows installer
        run: ./tool/build_windows_installer.ps1 -Version ${{ steps.version.outputs.version }} -BuildNumber ([int]${{ github.run_number }})
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-windows
          path: output/release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [phone, tv]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools'
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build debug APKs
        env:
          ANDROID_FLAVOR: ${{ matrix.flavor }}
        run: |
          version=$(awk -F '[:+ ]+' '/^version:/{print $2; exit}' pubspec.yaml)
          flutter build apk --debug --flavor "$ANDROID_FLAVOR" --split-per-abi --build-name "$version" --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p output/build
          suffix=
          if [ "$ANDROID_FLAVOR" = tv ]; then suffix='-tv'; fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-${abi}-${ANDROID_FLAVOR}-debug.apk"
            test -s "$apk" || { echo "Missing APK: $apk"; ls -l build/app/outputs/flutter-apk; exit 1; }
            cp -- "$apk" "output/build/MiniReel-${version}-android${suffix}-${abi}-debug.apk"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-android-${{ matrix.flavor }}
          path: output/build/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build macOS
        run: |
          version=$(awk -F '[:+ ]+' '/^version:/{print $2; exit}' pubspec.yaml)
          flutter build macos --release --build-name "$version" --build-number "$GITHUB_RUN_NUMBER"
          app='build/macos/Build/Products/Release/minireel.app'
          test -d "$app" || { echo "Missing macOS app bundle"; ls -la build/macos/Build/Products/Release; exit 1; }
          mkdir -p output/build
          ditto -c -k --keepParent "$app" "output/build/MiniReel-${version}-macos.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-macos
          path: output/build/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
